name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore CloudFileSystem.csproj
      - run: dotnet restore Tests/CloudFileSystem.Tests.csproj
      - run: dotnet build CloudFileSystem.csproj --configuration Release --no-restore
      - run: dotnet test Tests/CloudFileSystem.Tests.csproj --configuration Release --no-restore --collect:"XPlat Code Coverage" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: TestResults/**/coverage.cobertura.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ClientApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ClientApp/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
